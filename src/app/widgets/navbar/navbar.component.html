<nav class="navbar">
  <a routerLink="/" class="brand-link" aria-label="LazyRhythm home">
    <span class="brand-title">LAZYRHYTHM</span>
    <span class="brand-slash">//</span>
    <span class="brand-sub">OFFBEAT LAB</span>
  </a>

  <div class="nav-links" [class.show]="isMenuOpen">
    <a routerLink="/works" routerLinkActive="active" (click)="closeMenu()">WORK</a>
    <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">ABOUT</a>
    <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">CONTACT</a>
    <a routerLink="/sponsor" routerLinkActive="active" (click)="closeMenu()">SUPPORT</a>
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light theme' : 'Switch to dark theme'">
      <span>{{ isDarkMode ? '[LIGHT]' : '[DARK]' }}</span>
    </button>
  </div>

  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle navigation menu">
    <span>{{ isMenuOpen ? '[X]' : '[MENU]' }}</span>
  </button>
</nav>
