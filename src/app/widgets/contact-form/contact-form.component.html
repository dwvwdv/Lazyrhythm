<form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
  <h2>{{ (formType === 'contact' ? 'form.contactTitle' : 'form.supportTitle') | t }}</h2>
  <div class="form-group"><label for="name">{{ 'form.name' | t }}</label><input id="name" type="text" formControlName="name" [placeholder]="'form.namePh' | t"></div>
  <div class="form-group"><label for="email">{{ 'form.email' | t }}</label><input id="email" type="email" formControlName="email" [placeholder]="'form.emailPh' | t"></div>
  <div class="form-group"><label for="subject">{{ 'form.subject' | t }}</label><input id="subject" type="text" formControlName="subject" [placeholder]="'form.subjectPh' | t"></div>
  <div class="form-group" *ngIf="formType === 'sponsor'"><label for="amount">{{ 'form.amount' | t }}</label><input id="amount" type="number" formControlName="amount" [placeholder]="'form.amountPh' | t"></div>
  <div class="form-group"><label for="message">{{ 'form.message' | t }}</label><textarea id="message" formControlName="message" rows="5" [placeholder]="'form.messagePh' | t"></textarea></div>
  <p *ngIf="submitted">{{ 'form.success' | t }}</p>
  <p *ngIf="submitError">{{ 'form.error' | t }}</p>
  <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">{{ (isSubmitting ? 'form.sending' : (formType === 'contact' ? 'form.send' : 'form.confirmSupport')) | t }}</button>
</form>
