<section class="about-container">
  <div class="about-header">
    <h1>{{ 'about.title' | t }}</h1>
    <p class="subtitle">{{ 'about.subtitle' | t }}</p>
  </div>

  <div class="about-content">
    <!-- Introduction -->
    <div class="story-section">
      <h2>{{ 'about.storyTitle' | t }}</h2>
      <p>{{ 'about.storyP1' | t }}</p>
      <p>{{ 'about.storyP2' | t }}</p>
    </div>

    <!-- Core Principles -->
    <div class="principles-section">
      <h2>{{ 'about.principlesTitle' | t }}</h2>
      <div class="principles-grid">
        <div class="principle-card" *ngFor="let principle of principles">
          <i [class]="principle.icon"></i>
          <h3>{{ principle.title | t }}</h3>
          <p>{{ principle.description | t }}</p>
        </div>
      </div>
    </div>

    <!-- Tech Stack -->
    <div class="tech-stack-section">
      <h2>{{ 'about.techTitle' | t }}</h2>
      <div class="tech-grid">
        <div class="tech-item" *ngFor="let tech of techStack">
          <i [class]="tech.icon"></i>
          <div class="tech-info">
            <span class="tech-name">{{tech.name}}</span>
            <span class="tech-category">{{ tech.category | t }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
