<section class="contact-container">
  <div class="contact-content">
    <div class="contact-info">
      <h1>{{ 'contact.title' | t }}</h1>
      <p>{{ 'contact.intro' | t }}</p>

      <div class="contact-methods">
        <div class="method">
          <i class="fas fa-envelope"></i>
          <h3>{{ 'contact.email' | t }}</h3>
          <p>contact&#64;lazyrhythm.com</p>
        </div>
        <a class="method" [href]="facebookUrl" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-facebook" aria-hidden="true"></i>
          <h3>{{ 'contact.facebook' | t }}</h3>
          <p>悠閒節奏 LazyRhythm</p>
        </a>
        <a class="method" [href]="githubUrl" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-github" aria-hidden="true"></i>
          <h3>{{ 'contact.github' | t }}</h3>
          <p>github.com/dwvwdv</p>
        </a>
      </div>
    </div>

    <div class="contact-form-wrapper">
      <app-contact-form formType="contact"></app-contact-form>
    </div>
  </div>
</section>
