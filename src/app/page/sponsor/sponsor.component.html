<section class="sponsor-container">
  <header class="sponsor-header">
    <p class="lr-eyebrow">{{ 'sponsor.eyebrow' | t }}</p>
    <h1 class="lr-title">{{ 'sponsor.title' | t }}</h1>
    <p class="lr-subtitle">{{ 'sponsor.intro' | t }}</p>
  </header>

  <div class="sponsor-layout">
    <div class="channels">
      <article class="channel card">
        <header class="channel-bar">
          <span class="channel-index">01</span>
          <h2 class="channel-name">{{ 'sponsor.bsc' | t }}</h2>
        </header>

        <div class="channel-body bsc">
          <figure class="qr">
            <img [src]="bscQRCode" [alt]="'sponsor.qrAlt' | t" width="180" height="180" loading="lazy">
            <figcaption>{{ 'sponsor.scan' | t }}</figcaption>
          </figure>

          <div class="address">
            <code #address class="address-value">{{ bscAddress }}</code>
            <button type="button" class="btn" (click)="copyBscAddress()" [class.is-copied]="copyState === 'copied'">
              <i class="fas" [class.fa-copy]="copyState !== 'copied'" [class.fa-check]="copyState === 'copied'" aria-hidden="true"></i>
              {{ (copyState === 'copied' ? 'sponsor.copiedShort' : 'sponsor.copy') | t }}
            </button>
            <p class="copy-status" role="status" aria-live="polite" [class.is-failed]="copyState === 'failed'">
              <ng-container *ngIf="copyState === 'copied'">{{ 'sponsor.copied' | t }}</ng-container>
              <ng-container *ngIf="copyState === 'failed'">{{ 'sponsor.copyFailed' | t }}</ng-container>
            </p>
          </div>
        </div>
      </article>

      <article class="channel card">
        <header class="channel-bar">
          <span class="channel-index">02</span>
          <h2 class="channel-name">Ko-fi</h2>
        </header>

        <div class="channel-body kofi">
          <p>{{ 'sponsor.kofi' | t }}</p>
          <a class="btn btn-primary" [href]="kofiLink" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-mug-hot" aria-hidden="true"></i>
            {{ 'sponsor.kofiCta' | t }}
            <i class="fas fa-external-link-alt external" aria-hidden="true"></i>
          </a>
        </div>
      </article>
    </div>

    <article class="channel card note">
      <header class="channel-bar">
        <span class="channel-index">03</span>
        <h2 class="channel-name">{{ 'form.supportTitle' | t }}</h2>
      </header>
      <div class="channel-body">
        <app-contact-form formType="sponsor" [showTitle]="false"></app-contact-form>
      </div>
    </article>
  </div>
</section>
